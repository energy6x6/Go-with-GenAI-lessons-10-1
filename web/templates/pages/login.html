{{define "content"}}<section class="panel auth-panel"><p class="eyebrow">LibraTrack</p><h1>Вхід до бібліотеки</h1><p class="muted">Увійдіть, щоб користуватися можливостями своєї ролі.</p>{{if .Error}}{{template "error_fragment" .}}{{end}}
<form method="post" action="/login" class="stack"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><div class="field"><label for="email">Електронна адреса</label><input id="email" name="email" type="email" value="{{.Email}}" required autocomplete="username"></div><div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" required maxlength="72" autocomplete="current-password"></div><button class="button">Увійти</button></form><p class="muted">Ще немає облікового запису? <a href="/register">Зареєструватися</a></p></section>{{end}}
