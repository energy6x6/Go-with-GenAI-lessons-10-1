{{define "content"}}<section class="panel auth-panel"><p class="eyebrow">LibraTrack</p><h1>Реєстрація читача</h1>{{if .Error}}{{template "error_fragment" .}}{{end}}
<form method="post" action="/register" class="stack"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><div class="field"><label for="name">Ім’я</label><input id="name" name="name" value="{{.Name}}" maxlength="200" autocomplete="name"></div><div class="field"><label for="email">Електронна адреса</label><input id="email" name="email" type="email" value="{{.Email}}" required autocomplete="username"></div><div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password"><small>Від 12 символів до 72 байтів.</small></div><button class="button">Зареєструватися</button></form><p><a href="/login">Уже зареєстровані? Увійти</a></p></section>{{end}}
