apiVersion: v1
kind: Namespace
metadata:
  name: projectgo-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: projectgo-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: projectgo/k3s-demo:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: projectgo-demo
spec:
  type: NodePort
  selector:
    app: demo-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
