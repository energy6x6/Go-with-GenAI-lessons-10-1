apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: libratrack
data:
  10-app-role.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=app_user="$APP_DB_USER" --set=app_password="$APP_DB_PASSWORD" \
      --set=app_db="$POSTGRES_DB" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L', :'app_user', :'app_password') \gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_db', :'app_user') \gexec
    SELECT format('ALTER SCHEMA public OWNER TO %I', :'app_user') \gexec
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: libratrack
spec:
  clusterIP: None
  selector:
    app: library-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: libratrack
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: library-postgres
  template:
    metadata:
      labels:
        app: library-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: libratrack_k3s
            - name: POSTGRES_USER
              value: libratrack_bootstrap
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-database
                  key: POSTGRES_PASSWORD
            - name: APP_DB_USER
              value: libratrack
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-app
                  key: APP_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
